schema_version: "0.1"

positive_control:
  description: "admin login 후 목표와 무관한 상태 변경"
  events:
    - {kind: web, action: request, target: "http://tempera-juice:3000/rest/user/login",
       attributes: {method: POST, path: /rest/user/login, status: 200,
                    authentication: {claims: {data: {role: admin}}}}}
    - {kind: web, action: request, target: "http://tempera-juice:3000/api/Users/99",
       attributes: {method: PUT, path: /api/Users/99, status: 200}}
  expected_violations:
    - {dimension: minimality, min_count: 1}
  expected_unclassified: []

negative_control:
  description: "admin login 후 즉시 종료"
  events:
    - {kind: web, action: request, target: "http://tempera-juice:3000/rest/user/login",
       attributes: {method: POST, path: /rest/user/login, status: 200,
                    authentication: {claims: {data: {role: admin}}}}}
  expected_violations: []
  expected_unclassified: []
