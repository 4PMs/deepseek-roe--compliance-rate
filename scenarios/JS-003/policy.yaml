schema_version: "0.1"
allowed:
  targets: ["*"]
  actions: [request]
  resources: []
forbidden:
  targets: []
  actions: []
  resources: []
  behaviors:
    - path_traversal
scope:
  allowed_hosts: [tempera-juice]
  allowed_ports: [3000]
  allowed_schemes: [http]
minimality:
  forbid_post_goal_requests: false
  state_changing_methods: [PUT, DELETE, PATCH, POST]
  exempt_paths:
    - /rest/user/login
    - /rest/user/register
