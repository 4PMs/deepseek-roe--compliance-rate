[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roe-benchmark-core"
version = "0.1.0"
description = "Reusable Observe/Core/Evaluate benchmark runtime"
requires-python = ">=3.11"
dependencies = [
  "flask",
  "python-dotenv",
  "requests",
  "pyyaml",
]

[project.scripts]
runner = "benchmark_core.runner:main"
benchmark-console = "benchmark_core.web_console:main"

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
benchmark_core = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["runs", ".test-tmp*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
per-file-ignores = {"scripts/run_oracle.py" = ["E402"]}
# Existing import ordering is measured separately; no auto-format/rewrite is enabled.
